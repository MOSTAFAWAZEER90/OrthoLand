services:
  orthoflow-api:
    build:
      context: .
      dockerfile: src/OrthoFlowAI.Api/Dockerfile
    container_name: orthoflow-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=OrthoFlowAI;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ConnectionStrings__Redis=redis:6379
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - SendGrid__ApiKey=${SENDGRID_API_KEY}
      - OpenAI__ApiKey=${OPENAI_API_KEY}
    networks:
      - orthoflow-network

  orthoflow-web:
    build:
      context: .
      dockerfile: src/OrthoFlowAI.Web/Dockerfile
    container_name: orthoflow-web
    restart: unless-stopped
    ports:
      - "5001:8080"
    depends_on:
      - orthoflow-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Api__BaseUrl=http://orthoflow-api:8080
    networks:
      - orthoflow-network

  postgres:
    image: postgres:16-alpine
    container_name: orthoflow-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - orthoflow-network

  redis:
    image: redis:7-alpine
    container_name: orthoflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - orthoflow-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  orthoflow-network:
    driver: bridge
